name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install
      - name: Build
        run: npm run build
      - name: Generate iOS app icons
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin
          cp icon.svg dist/icon.svg
          rsvg-convert -w 180 -h 180 dist/icon.svg -o dist/apple-touch-icon.png
          rsvg-convert -w 192 -h 192 dist/icon.svg -o dist/icon-192.png
          rsvg-convert -w 512 -h 512 dist/icon.svg -o dist/icon-512.png
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
